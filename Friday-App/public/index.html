<style>
:root{--bg:#f5f7ff;--card:#fff;--tx:#14162b;--mut:#5d6385;--ac:#5b5bf0;--ac2:#14b8a6;--bd:#e3e6f5;--inp:#f8f9ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0f1f;--card:#171a31;--tx:#eef0ff;--mut:#9aa1c9;--bd:#272b4d;--inp:#1d2140}}
:root[data-theme="dark"]{--bg:#0d0f1f;--card:#171a31;--tx:#eef0ff;--mut:#9aa1c9;--bd:#272b4d;--inp:#1d2140}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Cairo,Inter,system-ui,sans-serif;line-height:1.6}
a{color:inherit}
.wrap{max-width:1180px;margin:auto;padding:0 18px}
nav{display:flex;justify-content:space-between;align-items:center;padding:16px 0}
.logo{font-weight:800;font-size:24px}.logo b{color:var(--ac)}
select,input,textarea,button{font:inherit;color:inherit}
select,input,textarea{width:100%;background:var(--inp);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--ac);box-shadow:0 0 0 3px rgba(91,91,240,.18)}
nav{position:sticky;top:0;z-index:20;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.hero{text-align:center;padding:56px 0 40px}
.hero h1{font-size:clamp(32px,6vw,60px);line-height:1.15;margin:0 0 14px;font-weight:800}
.hero h1 span{background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--mut);max-width:640px;margin:0 auto 26px;font-size:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:12px 24px;font-weight:800;cursor:pointer;background:linear-gradient(90deg,var(--ac),#8a5bf0);color:#fff;text-decoration:none;box-shadow:0 10px 26px rgba(91,91,240,.32)}
.btn.sec{background:var(--card);color:var(--tx);border:1px solid var(--bd);box-shadow:none}
.btn:disabled{opacity:.6;cursor:wait}
.feat{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin:34px 0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:20px}
.feat .card h3{margin:6px 0;font-size:17px}.feat .card p{margin:0;color:var(--mut);font-size:14px}
.ico{font-size:28px}
.grid{display:grid;grid-template-columns:minmax(0,430px) minmax(0,1fr);gap:20px;align-items:start}
@media(max-width:900px){.grid{grid-template-columns:1fr}}
h2{font-size:28px;margin:30px 0 14px}
label{display:block;font-size:13px;font-weight:600;color:var(--mut);margin:10px 0 4px}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.exp{border:1px dashed var(--bd);border-radius:14px;padding:10px;margin:10px 0;position:relative}
.exp .x{position:absolute;top:6px;inset-inline-end:8px;background:none;border:0;cursor:pointer;color:#e0445a;font-size:18px}
.tpls{display:grid;gap:8px}
.tpl{display:flex;gap:10px;align-items:center;border:2px solid var(--bd);border-radius:14px;padding:10px;cursor:pointer}
.tpl input{width:auto}.tpl.on{border-color:var(--ac);background:rgba(91,91,240,.07)}
.tpl small{display:block;color:var(--mut)}
#msg{margin-top:10px;font-size:14px;min-height:20px}
.err{color:#e0445a}.ok{color:#0f9f6e}
.pv{position:sticky;top:12px}
.paper-wrap{overflow:auto;border-radius:16px;background:rgba(120,120,160,.12);padding:14px}
.empty{padding:70px 20px;text-align:center;color:var(--mut)}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.soon{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.soon .card{opacity:.85}.tag{display:inline-block;background:rgba(20,184,166,.15);color:var(--ac2);border-radius:99px;padding:2px 10px;font-size:12px;font-weight:800}
footer{margin:50px 0 24px;padding-top:22px;border-top:1px solid var(--bd);text-align:center;color:var(--mut)}
footer a.ig{display:inline-flex;align-items:center;gap:8px;text-decoration:none;font-weight:800;color:var(--tx);margin-top:6px}
footer svg{width:26px;height:26px}
.photoprev{width:84px;height:84px;border-radius:50%;object-fit:cover;border:3px solid var(--ac);margin-top:8px;display:none}
.lang{display:flex;gap:4px;background:var(--card);border:1px solid var(--bd);border-radius:99px;padding:4px}.lang:before{content:"🌐";align-self:center;padding:0 8px}.lang button{border:0;background:none;border-radius:99px;padding:6px 14px;font-weight:800;cursor:pointer;color:var(--mut)}.lang button.on{background:linear-gradient(90deg,var(--ac),#8a5bf0);color:#fff;box-shadow:0 6px 16px rgba(91,91,240,.35)}
.blobs{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}.blobs i{position:absolute;width:46vw;height:46vw;max-width:560px;max-height:560px;border-radius:50%;filter:blur(90px);opacity:.38;animation:fl 16s ease-in-out infinite alternate}.blobs i:nth-child(1){background:#5b5bf0;top:-12%;inset-inline-start:-8%}.blobs i:nth-child(2){background:#14b8a6;top:30%;inset-inline-end:-12%;animation-delay:-5s}.blobs i:nth-child(3){background:#f0589b;bottom:-18%;inset-inline-start:30%;animation-delay:-9s;opacity:.25}@keyframes fl{to{transform:translate(40px,-30px) scale(1.15)}}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:30px;align-items:center;text-align:start;padding:40px 0 20px}.hero h1{font-size:clamp(34px,5.4vw,64px)}.hero p{margin:0 0 24px}.trust{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.trust span{background:var(--card);border:1px solid var(--bd);border-radius:99px;padding:4px 14px;font-size:13px;font-weight:600}.trust span:before{content:"✓ ";color:var(--ac2);font-weight:800}
.mock{position:relative;justify-self:center;width:min(330px,100%);aspect-ratio:3/4;background:#fff;border-radius:22px;padding:24px;box-shadow:0 30px 70px rgba(91,91,240,.38);transform:rotate(-4deg);animation:bob 5s ease-in-out infinite alternate}@keyframes bob{to{transform:rotate(2deg) translateY(-12px)}}.mock .av{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--ac),var(--ac2));float:inline-start;margin-inline-end:12px}.mock b{display:block;height:11px;border-radius:6px;background:#dfe2f6;margin:11px 0}.mock .h{background:#232652;width:52%;margin-top:14px}.mock .s{width:78%}.mock .ai{position:absolute;bottom:-16px;inset-inline-end:-14px;background:linear-gradient(90deg,var(--ac2),var(--ac));color:#fff;padding:8px 18px;border-radius:99px;font-weight:800;box-shadow:0 12px 26px rgba(20,184,166,.4)}
.feat{margin-top:20px}.feat .card{transition:.25s}.feat .card:hover{transform:translateY(-6px);border-color:var(--ac);box-shadow:0 18px 40px rgba(91,91,240,.2)}.grid>.card{box-shadow:0 20px 50px rgba(91,91,240,.12)}h2{font-size:32px}

@media print{.noprint{display:none!important}body{background:#fff}.paper-wrap{padding:0;background:none;overflow:visible}.pv{position:static}.grid{display:block}.card{border:0;padding:0}#cv{box-shadow:none!important;margin:0!important}}

var CVCSS=".cv{background:#fff;color:#1b1b1b;width:794px;max-width:none;min-height:1000px;margin:0 auto;padding:44px 48px;font-family:Cairo,Inter,Arial,sans-serif;font-size:13px;line-height:1.55;box-shadow:0 10px 40px rgba(0,0,0,.18);text-align:start}.cv h1{font-size:30px;margin:0;line-height:1.15}.cv .jb{font-size:15px;margin:2px 0 8px}.cv h2{font-size:14px;text-transform:uppercase;letter-spacing:.06em;margin:18px 0 6px;padding-bottom:3px;border-bottom:1.5px solid var(--c)}.cv ul{margin:4px 0 0;padding-inline-start:18px}.cv .row{display:flex;justify-content:space-between;gap:10px}.cv .it{margin:8px 0}.cv .ct{color:#444}.cv.gulf{--c:#000}.cv.gulf h1{font-size:26px}.cv.na{--c:#2b5bd7}.cv.na h1{color:#2b5bd7}.cv.na .jb{color:#444}.cv.eu{--c:#0f766e;padding:0;display:grid;grid-template-columns:240px 1fr}.cv.eu aside{background:#0f3d3a;color:#fff;padding:36px 22px}.cv.eu aside h2{color:#fff;border-color:rgba(255,255,255,.4)}.cv.eu aside .ph{width:150px;height:150px;border-radius:50%;object-fit:cover;display:block;margin:0 auto 14px;border:4px solid #fff}.cv.eu main{padding:40px 34px}.cv.eu main h1{color:#0f766e}.cv.eu aside li{margin:2px 0}.cv.eu aside ul{list-style:none;padding:0}";
document.getElementById("cvcss").textContent=CVCSS;

var S={ui:"ar",tpl:"gulf",photo:"",ai:null,last:null};
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function t(k){return T[S.ui][k]}

function applyUI(){
 var l=S.ui;$("ui").querySelectorAll("button").forEach(function(b){b.classList.toggle("on",b.getAttribute("data-l")===l)});document.documentElement.lang=l;document.documentElement.dir=CVT[l].dir;
 document.querySelectorAll("[data-i]").forEach(function(e){var v=T[l][e.getAttribute("data-i")];if(v!==undefined)e.textContent=v});
 document.querySelectorAll("[data-p]").forEach(function(e){e.placeholder=T[l][e.getAttribute("data-p")]||""});
 document.querySelectorAll(".exp").forEach(function(r){r.querySelector(".pl").placeholder=t("place");r.querySelector(".ro").placeholder=t("role");r.querySelector(".dt").placeholder=t("dates")});
 buildTpls();
}
function buildTpls(){
 var h="";["gulf","na","eu"].forEach(function(k){h+='<label class="tpl'+(S.tpl===k?" on":"")+'" style="margin:0"><input type="radio" name="tpl" value="'+k+'"'+(S.tpl===k?" checked":"")+'><span style="font-weight:800;color:var(--tx)">'+esc(t("t_"+k))+'<small>'+esc(t("t_"+k+"d"))+'</small></span></label>'});
 $("tpls").innerHTML=h;
 $("tpls").querySelectorAll("input").forEach(function(i){i.addEventListener("change",function(){S.tpl=i.value;buildTpls();$("photobox").style.display=S.tpl==="eu"?"block":"none"})});
 $("photobox").style.display=S.tpl==="eu"?"block":"none";
}
function addExp(){
 if(document.querySelectorAll(".exp").length>=8)return;
 var d=document.createElement("div");d.className="exp";
 d.innerHTML='<button type="button" class="x" aria-label="remove">×</button><input class="pl" maxlength="80" style="margin-bottom:6px"><div class="r2"><input class="ro" maxlength="80"><input class="dt" maxlength="30"></div>';
 d.querySelector(".x").onclick=function(){if(document.querySelectorAll(".exp").length>1)d.remove()};
 d.querySelector(".pl").placeholder=t("place");d.querySelector(".ro").placeholder=t("role");d.querySelector(".dt").placeholder=t("dates");
 $("exps").appendChild(d);
}
function collect(){
 var ex=[];document.querySelectorAll(".exp").forEach(function(r){
  var p=r.querySelector(".pl").value.trim(),ro=r.querySelector(".ro").value.trim();
  if(p||ro)ex.push({place:p,role:ro,dates:r.querySelector(".dt").value.trim()})});
 return{fn:$("fn").value.trim(),ln:$("ln").value.trim(),em:$("em").value.trim(),ph:$("ph").value.trim(),lo:$("lo").value.trim(),li:$("li").value.trim(),job:$("job").value.trim(),
  edu:$("edu").value.split("\n").map(function(s){return s.trim()}).filter(Boolean),langs:$("langs").value.split(/[,،]/).map(function(s){return s.trim()}).filter(Boolean),
  exps:ex,tpl:S.tpl,cl:$("cl").value,photo:S.photo};
}
function ul(a){return a&&a.length?"<ul>"+a.map(function(x){return"<li>"+esc(x)+"</li>"}).join("")+"</ul>":""}
function cvHTML(d,ai){
 var L=CVT[d.cl],a=ai||{},name=esc((d.fn+" "+d.ln).trim());
 var cts=[d.em,d.ph,d.lo,d.li].filter(Boolean);
 var ctInline=cts.map(esc).join(" &nbsp;•&nbsp; ");
 var exp=d.exps.map(function(e,i){
  var duties=a.experiences&&a.experiences[i]&&a.experiences[i].duties;
  return'<div class="it"><div class="row"><b>'+esc(e.role)+'</b><span>'+esc(e.dates)+'</span></div><div>'+esc(e.place)+'</div>'+ul(duties)+'</div>'}).join("");
 var obj=a.objective?'<h2>'+L.obj+'</h2><p style="margin:0">'+esc(a.objective)+'</p>':"";
 var edu=d.edu.length?'<h2>'+L.edu+'</h2>'+ul(d.edu):"";
 var sk=a.skills&&a.skills.length?a.skills:[];
 var lg=d.langs.length?d.langs:[];
 if(d.tpl==="eu"){
  var ph=d.photo?'<img class="ph" alt="" src="'+d.photo+'">':"";
  return'<div class="cv eu" dir="'+L.dir+'" contenteditable="true"><aside>'+ph+'<h2>'+L.ct+'</h2><ul>'+cts.map(function(c){return"<li>"+esc(c)+"</li>"}).join("")+'</ul>'+(sk.length?'<h2>'+L.sk+'</h2>'+ul(sk):"")+(lg.length?'<h2>'+L.lg+'</h2>'+ul(lg):"")+'</aside><main><h1>'+name+'</h1><div class="jb">'+esc(d.job)+'</div>'+obj+'<h2>'+L.exp+'</h2>'+exp+edu+'</main></div>';
 }
 return'<div class="cv '+d.tpl+'" dir="'+L.dir+'" contenteditable="true"><h1>'+name+'</h1><div class="jb">'+esc(d.job)+'</div><div class="ct">'+ctInline+'</div>'+obj+'<h2>'+L.exp+'</h2>'+exp+edu+(sk.length?'<h2>'+L.sk+'</h2><p style="margin:0">'+sk.map(esc).join(" &nbsp;•&nbsp; ")+'</p>':"")+(lg.length?'<h2>'+L.lg+'</h2><p style="margin:0">'+lg.map(esc).join(" &nbsp;•&nbsp; ")+'</p>':"")+'</div>';
}
function setMsg(c,m){var e=$("msg");e.className=c;e.textContent=m}
function show(html){var c=$("cv");c.className="";c.removeAttribute("data-i");c.innerHTML=html;$("acts").style.display="flex"}

async function callAI(d){var res=await fetch("/api/generate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({cl:d.cl,tpl:d.tpl,job:d.job,exps:d.exps.map(function(e){return{place:e.place,role:e.role}})})});if(!res.ok)throw new Error("api");return await res.json()}
async function generate(){
 var d=collect();
 if(!d.fn||!d.job||!d.exps.length||!d.exps[0].place||!d.exps[0].role){setMsg("err",t("needs"));return}
 if(Date.now()-(S.t||0)<8000){setMsg("err","⏳");return}
 S.t=Date.now();var b=$("gen");b.disabled=true;setMsg("ok",t("busy"));
 var ai=null;
 try{
  var r=await callAI(d);
  if(r&&typeof r==="object"){
   ai={objective:typeof r.objective==="string"?r.objective:"",skills:Array.isArray(r.skills)?r.skills.map(String):[],experiences:Array.isArray(r.experiences)?r.experiences.map(function(x){return{duties:Array.isArray(x&&x.duties)?x.duties.map(String):[]}}):[]};
  }
 }catch(e){ai=null}
 S.last=d;S.ai=ai;
 show(cvHTML(d,ai));
 setMsg(ai?"ok":"err",ai?t("done"):t("noai"));
 b.disabled=false;
 $("cv").scrollIntoView({behavior:"smooth",block:"start"});
}

function onPhoto(ev){
 var f=ev.target.files&&ev.target.files[0];if(!f)return;
 var img=new Image(),url=URL.createObjectURL(f);
 img.onload=function(){
  try{
   var s=Math.min(img.width,img.height),c=document.createElement("canvas");c.width=c.height=480;
   var x=c.getContext("2d");x.fillStyle=$("bg").value;x.fillRect(0,0,480,480);
   if($("enh").checked&&"filter" in x)x.filter="brightness(1.06) contrast(1.08) saturate(1.1)";
   x.drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,480,480);
   S.photo=c.toDataURL("image/jpeg",.9);
   var p=$("pp");p.src=S.photo;p.style.display="block";
  }catch(e){setMsg("err",t("perr"))}
  URL.revokeObjectURL(url);
 };
 img.onerror=function(){setMsg("err",t("perr"));URL.revokeObjectURL(url)};
 img.src=url;
}

function currentCV(){var c=document.querySelector("#cv .cv");return c?c.cloneNode(true):null}
async function saveHTML(){
 var c=currentCV();if(!c)return;c.removeAttribute("contenteditable");c.querySelectorAll("script,iframe,object,embed,link,style,form,base,meta").forEach(function(n){n.remove()});[c].concat(Array.prototype.slice.call(c.querySelectorAll("*"))).forEach(function(n){Array.prototype.slice.call(n.attributes).forEach(function(a){if(/^on/i.test(a.name)||/^\s*javascript:/i.test(a.value))n.removeAttribute(a.name)})});
 var html='<!DOCTYPE html><html lang="'+S.last.cl+'" dir="'+CVT[S.last.cl].dir+'"><head><meta charset="utf-8"><title>CV</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=Inter:wght@400;600;800&display=swap" rel="stylesheet"><style>body{margin:0;background:#eee}'+CVCSS+'@media print{body{background:#fff}.cv{box-shadow:none!important}}</style></head><body>'+c.outerHTML+'</body></html>';
 try{var u=URL.createObjectURL(new Blob([html],{type:"text/html"})),a=document.createElement("a");a.href=u;a.download="CV.html";document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},4000);setMsg("ok",t("saved"))}catch(e){setMsg("err","⚠ HTML")}
}

(function(){var n=((navigator.language||"ar")+"").slice(0,2).toLowerCase();S.ui=(n==="en"||n==="fr")?n:"ar";$("cl").value=S.ui})();
$("ui").querySelectorAll("button").forEach(function(b){b.addEventListener("click",function(){S.ui=b.getAttribute("data-l");$("cl").value=S.ui;applyUI()})});
$("addexp").onclick=addExp;$("gen").onclick=generate;$("photo").addEventListener("change",onPhoto);
$("pdf").onclick=function(){try{window.print()}catch(e){saveHTML()}};
$("dl").onclick=saveHTML;
$("cv").addEventListener("paste",function(e){var cd=e.clipboardData||window.clipboardData;if(!cd)return;e.preventDefault();document.execCommand("insertText",false,cd.getData("text/plain"))});
addExp();applyUI();
if("serviceWorker" in navigator)window.addEventListener("load",function(){navigator.serviceWorker.register("/sw.js").catch(function(){})});
</script>
</body>
